<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Finder</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #626a78; --line: #e2e5ea;
  --accent: #d9570f; --accent-soft: #fdeee4; --good: #1a7f4b; --good-soft: #e3f4ea;
  --on-accent: #fff; --ok: #8a6100; --ok-soft: #fbf1d6; --bad: #b42318; --bad-soft: #fde8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --card: #1a1d23; --text: #e9ebef; --muted: #9aa2b1; --line: #2b3039;
    --accent: #ff8a3d; --accent-soft: #3a2415; --good: #5fd39a; --good-soft: #15301f;
    --on-accent: #16181d; --ok: #f1c35b; --ok-soft: #362b10; --bad: #ff8b80; --bad-soft: #3a1714;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 16px; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
select, input[type=time], input[type=text], input[type=url], input[type=number] { font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; min-height: 36px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.row > span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase;
  letter-spacing: .03em; margin-right: 4px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg);
  color: var(--muted); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.chip.err { border-color: var(--bad); }
/* a court still being checked: small spinning ring before its name */
.chip.loading::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 6px;
  border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
  vertical-align: -1px; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.progress { flex: 1 1 120px; max-width: 220px; height: 6px; background: var(--line); border-radius: 999px;
  overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.progress[hidden] { display: none; }
.slot.stale { opacity: .45; }  /* old results while that court is being re-checked */
@media (prefers-reduced-motion: reduce) {
  .chip.loading::before { animation: none; border-top-color: var(--line); border-color: var(--accent); }
  .progress > div { transition: none; }
}
.chip small { color: var(--muted); }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
button.primary { font: inherit; font-weight: 600; background: var(--accent); color: var(--on-accent);
  border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
button.primary:disabled { opacity: .6; cursor: default; }
#status { color: var(--muted); font-size: 13px; }
.errors { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 8px 12px;
  font-size: 13px; margin-bottom: 12px; }
.errors:empty { display: none; }
.day { margin-bottom: 14px; }
.day h2 { font-size: 15px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.day h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
.slot { display: grid; grid-template-columns: 112px 64px 1fr auto auto; gap: 10px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 6px; }
.time { font-weight: 700; font-variant-numeric: tabular-nums; }
.dur { color: var(--muted); font-size: 13px; }
.court { min-width: 0; }
.court b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.court small { color: var(--muted); }
.badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.f100 { background: var(--good-soft); color: var(--good); }
.fpart { background: var(--ok-soft); color: var(--ok); }
a.book { font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.book:hover { text-decoration: underline; }
a.maps { color: var(--accent); text-decoration: none; white-space: nowrap; }
a.maps:hover { text-decoration: underline; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
.demo { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 6px 10px;
  font-size: 13px; display: inline-block; margin-bottom: 12px; }
details.panel > summary { font-weight: 700; cursor: pointer; }
details.panel[open] > summary { margin-bottom: 12px; }
.manage-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.manage-row input[type=url] { flex: 1; min-width: 220px; }
button.link { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted);
  cursor: pointer; padding: 4px 6px; }
button.link:hover { color: var(--bad); }
.court-list { margin-top: 12px; display: grid; gap: 6px; }
.court-item { display: grid; grid-template-columns: 1fr 90px 90px 90px auto; gap: 8px; align-items: center;
  border-top: 1px solid var(--line); padding-top: 6px; }
.court-item small { display: block; color: var(--muted); }
.court-item input, .court-item select { width: 100%; }
.msg { font-size: 13px; margin-top: 8px; }
.hint { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.tomtom { margin-top: 12px; border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
.tomtom .manage-row { margin-top: 8px; }
.tomtom label.check { flex-direction: row; align-items: center; gap: 6px; text-transform: none;
  letter-spacing: 0; font-weight: 400; font-size: 13px; }
.tomtom input[type=password] { font: inherit; color: var(--text); background: var(--bg); flex: 1; min-width: 200px;
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; min-height: 36px; }
.finder { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 12px; }
.finder input[type=text] { flex: 1; min-width: 160px; }
.find-item { display: grid; grid-template-columns: 1fr 70px 100px 110px; gap: 8px; align-items: center;
  border-top: 1px solid var(--line); padding-top: 6px; font-size: 14px; }
.find-item small { display: block; color: var(--muted); }
.find-item .num { color: var(--muted); font-variant-numeric: tabular-nums; }
.find-item .added { font-size: 13px; color: var(--good); }
button.small { padding: 5px 10px; font-size: 13px; }
@media (max-width: 620px) {
  .find-item { grid-template-columns: 1fr auto; }
  .find-item > div:first-child { grid-column: 1 / -1; }
}
.court-item small.src { font-size: 11px; text-transform: none; letter-spacing: 0; font-weight: 400; }
.msg.ok { color: var(--good); }
.msg.bad { color: var(--bad); }
@media (max-width: 620px) {
  .court-item { grid-template-columns: 1fr 1fr; }
  .court-item > div:first-child { grid-column: 1 / -1; }
  .slot { grid-template-columns: 1fr auto; }
  .slot .dur { display: none; }
  .slot .court { grid-column: 1 / -1; order: 3; }
  .slot a.book { order: 4; }
}
</style>
</head>
<body>
<main>
  <h1>Court Finder</h1>
  <p class="sub">Basketball slots with at least the chosen share of the hall free.</p>
  <div id="demo"></div>

  <section class="panel">
    <div class="filters">
      <label>Look ahead
        <select id="days"><option value="7">1 week</option><option value="14" selected>2 weeks</option>
          <option value="21">3 weeks</option><option value="28">4 weeks</option></select></label>
      <label>At least free
        <select id="min_free"><option value="25">25%</option><option value="50" selected>50%</option>
          <option value="75">75%</option><option value="100">100% (whole hall)</option></select></label>
      <label>Shortest slot
        <select id="min_minutes"><option value="30">30 min</option><option value="60" selected>1 hour</option>
          <option value="90">1.5 hours</option><option value="120">2 hours</option></select></label>
      <label>From <input type="time" id="after" step="1800"></label>
      <label>Until <input type="time" id="before" step="1800"></label>
      <label>Sort by
        <select id="sort"><option value="date">Date</option><option value="price">Price</option>
          <option value="drive">Drive time</option></select></label>
    </div>
    <div class="row" id="groups"><span>Group</span></div>
    <div class="row" id="weekdays"><span>Days</span></div>
    <div class="row" id="courts"><span>Courts</span></div>
    <div class="actions">
      <button class="primary" id="refresh">Refresh from site</button>
      <div class="progress" id="progress" hidden role="progressbar" aria-label="Courts checked"
        aria-valuemin="0"><div id="progressBar"></div></div>
      <span id="status" aria-live="polite">Loading…</span>
    </div>
  </section>

  <details class="panel" id="manage">
    <summary>Manage groups &amp; courts</summary>
    <div class="manage-row">
      <label style="flex:1;min-width:160px">Group <select id="mGroup"></select></label>
      <button class="link" id="mRename" type="button">Rename</button>
      <button class="link" id="mDelete" type="button">Delete group</button>
      <button class="link" id="mNew" type="button" style="color:var(--accent)">+ New group</button>
    </div>
    <div class="manage-row" id="mFromRow" style="margin-top:12px">
      <label style="flex:1;min-width:160px">Driving from
        <input type="text" id="mFrom" maxlength="60" placeholder="e.g. Home, Pell St or a postcode"></label>
    </div>
    <p class="hint" id="mFromHint"></p>
    <div class="tomtom" id="mTomTom">
      <b>Estimate drive times with TomTom</b>
      <div class="manage-row" id="tKeyRow">
        <input type="password" id="tKey" autocomplete="off" placeholder="Paste your free TomTom API key">
        <button class="link" id="tKeySave" type="button" style="color:var(--accent)">Save key</button>
      </div>
      <p class="hint" id="tKeyHint"></p>
      <div class="manage-row" id="tEstRow">
        <label>Leaving <select id="tDay"><option value="now">Now</option>
          <option value="mon">Monday</option><option value="tue">Tuesday</option><option value="wed">Wednesday</option>
          <option value="thu">Thursday</option><option value="fri">Friday</option><option value="sat">Saturday</option>
          <option value="sun">Sunday</option></select></label>
        <label>At <input type="time" id="tTime" value="18:00" step="900"></label>
        <label class="check"><input type="checkbox" id="tReplace"> also replace my own guesses</label>
        <button class="primary" id="tEstimate" type="button">Estimate drive times</button>
      </div>
    </div>
    <form class="manage-row" id="mAdd" style="margin-top:12px">
      <input type="url" id="mUrl" required
        placeholder="Paste a court's link, e.g. https://schoolhire.co.uk/…/basketball-court/4532">
      <button class="primary" type="submit">Add court</button>
    </form>
    <div class="msg" id="mMsg"></div>
    <div class="court-list" id="mCourts"></div>
    <div class="finder" id="finder">
      <b>Find basketball courts near a postcode</b>
      <form class="manage-row" id="fForm" style="margin-top:8px">
        <input type="text" id="fPlace" required maxlength="10" placeholder="e.g. NW9 4GD, or just NW9"
          aria-label="Postcode">
        <select id="fMiles" aria-label="Distance"><option value="3">within 3 miles</option>
          <option value="5">within 5 miles</option><option value="10" selected>within 10 miles</option>
          <option value="15">within 15 miles</option><option value="20">within 20 miles</option></select>
        <button class="primary" type="submit" id="fGo">Search</button>
      </form>
      <p class="hint" id="fMsg"></p>
      <div class="court-list" id="fResults"></div>
    </div>
  </details>

  <div class="errors" id="errors"></div>
  <div id="results"></div>
</main>

<script>
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const $ = id => document.getElementById(id);
const FIELDS = ["days", "min_free", "min_minutes", "after", "before", "sort"];
let state = { weekdays: [], hide: [], group: "" };

function save() {
  const s = { ...state };
  FIELDS.forEach(f => s[f] = $(f).value);
  try { localStorage.setItem("courtFinder", JSON.stringify(s)); } catch (e) {}
}
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem("courtFinder") || "null");
    if (!s) return;
    FIELDS.forEach(f => { if (s[f] !== undefined) $(f).value = s[f]; });
    if (!$("sort").value) $("sort").value = "date";
    state.weekdays = s.weekdays || [];
    state.hide = s.hide || [];
    state.group = s.group || "";
  } catch (e) {}
}

function chip(label, on, onClick) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.innerHTML = label;
  b.onclick = onClick;
  return b;
}
function renderWeekdays() {
  const row = $("weekdays");
  row.querySelectorAll(".chip").forEach(c => c.remove());
  DAYS.forEach((d, i) => row.appendChild(chip(d, state.weekdays.includes(i), () => {
    state.weekdays = state.weekdays.includes(i)
      ? state.weekdays.filter(x => x !== i) : [...state.weekdays, i];
    renderWeekdays(); load();
  })));
}
// One chip per group; picking one only checks that group's courts.
function renderGroups(groups) {
  const row = $("groups");
  row.querySelectorAll(".chip").forEach(c => c.remove());
  row.style.display = groups.length > 1 ? "" : "none";
  [{ id: "", name: "All" }, ...groups].forEach(g =>
    row.appendChild(chip(esc(g.name), state.group === g.id, () => {
      state.group = g.id;
      load();
    })));
}
const fmtPrice = p => p == null ? "price on site" : `£${p}`;
// A guess: "~25 min from Pell St". A TomTom estimate (has "when"):
// "25 min (8.1 mi) from Pell St · TomTom, Tue 18:00".
const fmtDrive = (drive, short) => (drive || []).map(d => {
  const est = d.when !== undefined;
  if (short) return `${est ? "" : "~"}${d.min}m`;
  return est ? `${d.min} min${d.miles != null ? ` (${d.miles} mi)` : ""} from ${esc(d.from)} · TomTom, ${esc(d.when)}`
             : `~${d.min} min from ${esc(d.from)} (guess)`;
}).join(short ? " / " : " · ");
// Google Maps driving directions; the same link the server builds for slots.
const mapsLink = (from, dest) => "https://www.google.com/maps/dir/?" +
  new URLSearchParams({ api: 1, origin: from, destination: dest, travelmode: "driving" });
// [{from, url}] -> "Directions ↗", or "Directions from X ↗ · from Y ↗" for several places
const fmtDirections = dirs => (dirs || []).map((d, i) =>
  `<a class="maps" href="${esc(d.url)}" target="_blank" rel="noopener">${
    dirs.length > 1 ? `${i ? "" : "Directions "}from ${esc(d.from)}` : "Directions"} ↗</a>`).join(" · ");

function renderCourts(courts, pending = new Set()) {
  const row = $("courts");
  row.querySelectorAll(".chip").forEach(c => c.remove());
  if (!courts.length) {
    row.insertAdjacentHTML("beforeend", '<span class="chip" style="cursor:default">' +
      "No courts yet: add one under “Manage groups &amp; courts”</span>");
  }
  courts.forEach(c => {
    const drive = fmtDrive(c.drive, true);
    const b = chip(`${esc(c.name)} <small>${fmtPrice(c.price)}${drive ? " · " + drive : ""}</small>`,
      !state.hide.includes(c.url), () => {
        state.hide = state.hide.includes(c.url)
          ? state.hide.filter(x => x !== c.url) : [...state.hide, c.url];
        load();
      });
    b.title = pending.has(c.url) ? "Checking this court…" : c.error || c.notes || "";
    if (pending.has(c.url)) b.classList.add("loading");
    else if (c.error) b.classList.add("err");
    row.appendChild(b);
  });
}

const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const fmtDay = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "short" });
const fmtDur = m => (m >= 60 ? `${Math.floor(m / 60)}h` : "") + (m % 60 ? `${m % 60}m` : "");

const courtOf = w => w.link.split("?")[0];

function renderResults(data, pending = new Set()) {
  const out = $("results");
  if (!data.windows.length) {
    out.innerHTML = pending.size
      ? '<div class="empty">Checking courts… slots appear here as each court is checked.</div>'
      : '<div class="empty">No slots match these filters. Try a lower % free, shorter slots or more days.</div>';
    return;
  }
  const byDate = new Map();
  data.windows.forEach(w => (byDate.get(w.date) || byDate.set(w.date, []).get(w.date)).push(w));
  const groups = $("sort").value === "date"
    ? [...byDate.entries()] : [["", data.windows]];
  out.innerHTML = groups.map(([date, ws]) => `
    <section class="day">
      ${date ? `<h2>${fmtDay(date)} <span>${ws.length} slot${ws.length > 1 ? "s" : ""}</span></h2>` : ""}
      ${ws.map(w => `
        <div class="slot${pending.has(courtOf(w)) ? " stale" : ""}">
          <div class="time">${date ? "" : `<div class="dur">${fmtDay(w.date)}</div>`}${w.start}–${w.end}</div>
          <div class="dur">${fmtDur(w.minutes)}</div>
          <div class="court"><b>${esc(w.court)}</b>
            <small>${fmtPrice(w.price)} · ${esc(w.court_size)} court${w.notes ? " · " + esc(w.notes) : ""}${
              w.drive.length || w.directions.length ? "<br>🚗 " + [fmtDrive(w.drive), fmtDirections(w.directions)]
                .filter(Boolean).join(" · ") : ""}</small></div>
          <span class="badge ${w.min_free_pct === 100 ? "f100" : "fpart"}">${w.min_free_pct}% free</span>
          <a class="book" href="${esc(w.link)}" target="_blank" rel="noopener">Book ↗</a>
        </div>`).join("")}
    </section>`).join("");
}

// Loading works court by court: /api/slots answers straight away with what's
// already loaded (fetch=0) and says which courts are "pending"; each of those is
// then fetched on its own with /api/fetch, and the page redraws as each arrives.
let seq = 0;
let loading = null;  // { my, pending: Set of urls, refresh: Set of urls, total }

function slotParams() {
  const p = new URLSearchParams();
  FIELDS.forEach(f => p.set(f, $(f).value));
  p.set("weekdays", state.weekdays.join(","));
  p.set("hide", state.hide.join("|"));
  p.set("group", state.group);
  p.set("fetch", "0");
  return p;
}

async function getSlots(my) {
  const r = await fetch("/api/slots?" + slotParams());
  const data = await r.json();
  if (my !== seq) return null;  // a newer load has started
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function render(data) {
  const pending = loading ? loading.pending : new Set();
  if (state.group !== data.group) { state.group = data.group; save(); }  // deleted group: All
  renderGroups(data.groups);
  renderCourts(data.courts, pending);
  renderResults(data, pending);
  const errs = data.courts.filter(c => c.error && !pending.has(c.url));
  $("errors").innerHTML = errs.map(c => `<div><b>${esc(c.name)}</b>: ${esc(c.error)}</div>`).join("");
  $("demo").innerHTML = data.demo ? '<span class="demo">Demo mode: showing the saved sample file, not live data.</span>' : "";
  const range = `${fmtDay(data.start)} – ${fmtDay(data.end)}`;
  if (pending.size) {
    const done = loading.total - pending.size;
    $("progress").hidden = false;
    $("progress").setAttribute("aria-valuemax", loading.total);
    $("progress").setAttribute("aria-valuenow", done);
    $("progressBar").style.width = `${Math.round(100 * done / loading.total)}%`;
    $("status").textContent = `Checked ${done} of ${loading.total} court${loading.total > 1 ? "s" : ""}… ` +
      `${data.windows.length} slot${data.windows.length === 1 ? "" : "s"} so far`;
  } else {
    $("progress").hidden = true;
    const at = data.courts.map(c => c.fetched_at).filter(Boolean).sort()[0];
    $("status").textContent = `${data.windows.length} slots · ${range}${at ? ` · data from ${at}` : ""}`;
  }
  $("refresh").disabled = pending.size > 0;
}

// Redraws are coalesced: while one is in flight, further requests just ask for one more.
let redrawing = false, redrawAgain = false;
async function redraw(my) {
  if (redrawing) { redrawAgain = true; return; }
  redrawing = true;
  try {
    do {
      redrawAgain = false;
      const data = await getSlots(my);
      if (data) render(data);
    } while (redrawAgain && my === seq);
  } catch (e) {
    if (my === seq) $("status").textContent = "Error: " + e.message;
  } finally {
    redrawing = false;
  }
}

async function load(refresh = false) {
  save();
  const my = ++seq;
  // a refresh still running carries on into this load (e.g. a filter changed meanwhile)
  const carried = loading ? loading.refresh : new Set();
  let data;
  try {
    data = await getSlots(my);
    if (!data) return;
  } catch (e) {
    $("status").textContent = "Error: " + e.message;
    return;
  }
  const urls = data.courts.map(c => c.url);
  const refreshSet = new Set(urls.filter(u => refresh || carried.has(u)));
  const pending = new Set(data.courts.filter(c => c.pending || refreshSet.has(c.url)).map(c => c.url));
  loading = pending.size ? { my, pending, refresh: refreshSet, total: pending.size } : null;
  render(data);
  if (!pending.size) return;

  await Promise.all([...pending].map(async url => {
    try {
      await fetch("/api/fetch", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url, days: $("days").value, refresh: refreshSet.has(url) }) });
    } catch (e) { /* shown as that court's error on the next redraw */ }
    if (my !== seq) return;  // superseded: the newer load tracks this court itself
    pending.delete(url);
    refreshSet.delete(url);
    if (!pending.size) loading = null;
    redraw(my);
  }));
}

// ------------------------------------------------------------------ manage groups & courts

let groups = [];  // [{ id, name, courts: [...] }]
const mGroup = () => groups.find(g => g.id === $("mGroup").value);
const msg = (text, ok) => { $("mMsg").textContent = text; $("mMsg").className = "msg " + (ok ? "ok" : "bad"); };

async function manageCall(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const json = await r.json();
  if (!r.ok) { msg(json.error || r.statusText, false); renderManage(); return null; }  // undo the bad edit
  groups = json.groups || json;
  renderManage();
  return json;
}

function renderManage() {
  const sel = $("mGroup"), was = sel.value || state.group || (groups[0] || {}).id;
  sel.innerHTML = groups.map(g =>
    `<option value="${esc(g.id)}">${esc(g.name)} (${g.courts.length})</option>`).join("");
  sel.value = groups.some(g => g.id === was) ? was : (groups[0] || {}).id || "";
  const g = mGroup();
  ["mAdd", "mRename", "mDelete", "mFromRow", "mFromHint", "mTomTom", "finder"].forEach(id => $(id).style.display = g ? "" : "none");
  if (g && g.depart && g.id !== renderManage.departFor) {  // the last departure used for this group
    const [day, time] = g.depart.split(" ");
    $("tDay").value = day; if (time) $("tTime").value = time;
    renderManage.departFor = g.id;
  }
  $("tTime").disabled = $("tDay").value === "now";
  if (g && !$("fPlace").value && /^[A-Z]{1,2}\d/i.test(g.from || "")) $("fPlace").value = g.from.split(",")[0];
  if (typeof renderFound === "function" && found) renderFound();
  if (g && document.activeElement !== $("mFrom")) $("mFrom").value = g.from || "";
  const from = g && (g.from || g.name);
  $("mFromHint").textContent = g ? `Put your guess of the drive from ${from} to each court in minutes, ` +
    "or let TomTom estimate them below. It’s shown on each slot and you can sort by it." : "";
  $("mCourts").innerHTML = !g ? "<p class=\"sub\">No groups yet. Press “+ New group” to make one.</p>"
    : !g.courts.length ? "<p class=\"sub\">No courts in this group yet. Paste a court’s link above.</p>"
    : g.courts.map(c => `
      <div class="court-item" data-url="${esc(c.url)}">
        <div><b>${esc(c.name)}</b><small>${esc(c.postcode || "")}${c.notes ? " · " + esc(c.notes) : ""}
          · <a href="${esc(c.url)}" target="_blank" rel="noopener">page ↗</a>${g.from ? ` · <a href="${
            esc(mapsLink(g.from, c.postcode || c.name))}" target="_blank" rel="noopener">map ↗</a>` : ""}</small></div>
        <label>£ / hour <input type="number" min="0" step="0.01" value="${c.price ?? ""}" data-f="price"></label>
        <label>Size <select data-f="court"><option value="half"${c.court !== "full" ? " selected" : ""}>Half</option>
          <option value="full"${c.court === "full" ? " selected" : ""}>Full</option></select></label>
        <label title="Drive from ${esc(from)}">Drive (min)
          <input type="number" min="0" max="600" step="1" placeholder="?" value="${c.drive_min ?? ""}" data-f="drive_min">
          <small class="src">${c.drive_source === "tomtom" ? `TomTom, ${esc(c.drive_when || "")}`
            : c.drive_min != null ? "your guess" : ""}</small></label>
        <button class="link" type="button" data-remove>Remove</button>
      </div>`).join("");
}

$("mGroup").addEventListener("change", () => { msg("", true); renderManage(); });
$("mFrom").addEventListener("change", async () => {
  const g = mGroup();
  if (g && await manageCall("PUT", `/api/groups/${g.id}`, { from: $("mFrom").value })) {
    msg("Saved.", true); load();
  }
});
$("mNew").onclick = async () => {
  const name = (prompt("Name for the new group, e.g. Tuesday crew") || "").trim();
  if (!name) return;
  if (await manageCall("POST", "/api/groups", { name })) {
    $("mGroup").value = groups[groups.length - 1].id;
    renderManage();
    msg(`Made ${name}. Now paste a court’s link to add it.`, true);
    load();
  }
};
$("mRename").onclick = async () => {
  const g = mGroup(), name = g && (prompt("New name", g.name) || "").trim();
  if (name && await manageCall("PUT", `/api/groups/${g.id}`, { name })) { msg("Renamed.", true); load(); }
};
$("mDelete").onclick = async () => {
  const g = mGroup();
  if (g && confirm(`Delete ${g.name} and its ${g.courts.length} court(s)?`)
      && await manageCall("DELETE", `/api/groups/${g.id}`)) { msg(`Deleted ${g.name}.`, true); load(); }
};
$("mAdd").addEventListener("submit", async e => {
  e.preventDefault();
  const g = mGroup();
  msg("Reading the court’s page…", true);
  const res = await manageCall("POST", `/api/groups/${g.id}/courts`, { url: $("mUrl").value });
  if (res) {
    const c = res.added;
    msg(`Added ${c.name}${c.price != null ? ` (£${c.price}/hour, ${c.court} hall)` : ""} to ${g.name}. ` +
        "Check the price and size below.", true);
    $("mUrl").value = "";
    load(true);
  }
});
// ------------------------------------------------------------------ find courts nearby
let found = null, showAll = false;  // the last search: { place, miles, total, results: [...] }
const SHOW_FIRST = 15;

function renderFound() {
  const g = mGroup();
  if (!found || !g) { $("fResults").innerHTML = ""; return; }
  const inGroup = r => g.courts.some(c => c.url === r.url);
  const list = showAll ? found.results : found.results.slice(0, SHOW_FIRST);
  $("fMsg").textContent = `${found.results.length} basketball court${found.results.length === 1 ? "" : "s"} ` +
    `within ${found.miles} miles of ${found.place}, nearest first. Courts are added to ${g.name}.`;
  $("fResults").innerHTML = list.map(r => `
    <div class="find-item" data-url="${esc(r.url)}">
      <div><b>${esc(r.venue || r.facility || "Court " + r.id)}</b>
        <small>${[r.venue && r.facility ? esc(r.facility) : "", esc(r.address || "")].filter(Boolean).join(" · ")}
          ${r.address ? "· " : ""}<a href="${esc(r.url)}" target="_blank" rel="noopener">page ↗</a></small></div>
      <span class="num">${r.miles != null ? `${r.miles} mi` : ""}</span>
      <span class="num">${r.price != null ? `${r.price_from ? "from " : ""}£${r.price}` : "price on page"}</span>
      ${inGroup(r) ? `<span class="added">✓ in ${esc(g.name)}</span>`
        : `<button class="primary small" type="button" data-add title="Add to ${esc(g.name)}">+ Add</button>`}
    </div>`).join("") + (!showAll && found.results.length > SHOW_FIRST
      ? `<button class="link" type="button" id="fMore">Show all ${found.results.length}</button>` : "");
}

$("fForm").addEventListener("submit", async e => {
  e.preventDefault();
  $("fGo").disabled = true;
  $("fMsg").textContent = "Searching schoolhire.co.uk…";
  $("fResults").innerHTML = "";
  try {
    const r = await fetch("/api/search?" + new URLSearchParams({ place: $("fPlace").value, miles: $("fMiles").value }));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || r.statusText);
    found = data; showAll = false;
    renderFound();
  } catch (err) {
    found = null;
    $("fMsg").textContent = "Error: " + err.message;
  } finally {
    $("fGo").disabled = false;
  }
});
$("fResults").addEventListener("click", async e => {
  if (e.target.id === "fMore") { showAll = true; return renderFound(); }
  const item = e.target.closest("[data-url]");
  if (!item || e.target.dataset.add === undefined) return;
  const g = mGroup();
  e.target.disabled = true;
  e.target.textContent = "Adding…";
  msg("Reading the court’s page…", true);
  const res = await manageCall("POST", `/api/groups/${g.id}/courts`, { url: item.dataset.url });
  if (res) {
    const c = res.added;
    msg(`Added ${c.name}${c.price != null ? ` (£${c.price}/hour, ${c.court} hall)` : ""} to ${g.name}.`, true);
    load();  // only the new court is fetched
  }
  renderFound();
});

// ------------------------------------------------------------------ TomTom
async function loadKey() {
  const r = await fetch("/api/settings"), k = await r.json();
  $("tKeyHint").innerHTML = k.tomtom_key_set
    ? `Key saved (${esc(k.key_hint)})${k.from_env ? " from TOMTOM_API_KEY" : ""}. ` +
      "Paste a new one above to change it, or save it empty to remove it."
    : 'Get a free key (no card needed) at <a href="https://developer.tomtom.com" target="_blank" ' +
      'rel="noopener">developer.tomtom.com</a> → Dashboard → Keys. It stays on this computer.';
  $("tEstimate").disabled = !k.tomtom_key_set;
}
$("tKeySave").onclick = async () => {
  const r = await fetch("/api/settings", { method: "PUT", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ tomtom_key: $("tKey").value }) });
  const k = await r.json();
  if (!r.ok) return msg(k.error, false);
  $("tKey").value = "";
  msg(k.tomtom_key_set ? "Key saved." : "Key removed.", true);
  loadKey();
};
$("tDay").addEventListener("change", () => $("tTime").disabled = $("tDay").value === "now");
$("tEstimate").onclick = async () => {
  const g = mGroup();
  if (!g) return;
  const depart = $("tDay").value === "now" ? "now" : `${$("tDay").value} ${$("tTime").value || "18:00"}`;
  $("tEstimate").disabled = true;
  msg(`Asking TomTom for ${g.courts.length} court(s)…`, true);
  try {
    const res = await manageCall("POST", `/api/groups/${g.id}/estimate`,
      { depart, replace: $("tReplace").checked });
    if (!res) return;
    const parts = [`Updated ${res.updated.length} court(s) for leaving ${res.depart}.`];
    if (res.skipped.length) parts.push(`Kept your own guess for ${res.skipped.join(", ")}.`);
    const failed = Object.entries(res.failed);
    if (failed.length) parts.push("Couldn’t do " + failed.map(([n, why]) => `${n} (${why})`).join(", ") + ".");
    msg(parts.join(" "), !failed.length);
    load();
  } finally {
    $("tEstimate").disabled = false;
  }
};

// Editing a court's price, size or drive time saves straight away.
$("mCourts").addEventListener("change", e => {
  const item = e.target.closest("[data-url]"), field = e.target.dataset.f;
  if (item && field) manageCall("PATCH", `/api/groups/${mGroup().id}/courts`,
    { url: item.dataset.url, [field]: e.target.value }).then(r => r && load());
});
$("mCourts").addEventListener("click", async e => {
  const item = e.target.closest("[data-url]");
  if (!item || e.target.dataset.remove === undefined) return;
  const g = mGroup(), c = g.courts.find(x => x.url === item.dataset.url);
  if (confirm(`Remove ${c.name} from ${g.name}?`)
      && await manageCall("DELETE", `/api/groups/${g.id}/courts?url=${encodeURIComponent(c.url)}`)) load();
});

restore();
renderWeekdays();
manageCall("GET", "/api/groups");
loadKey();
FIELDS.forEach(f => $(f).addEventListener("change", () => load()));
$("refresh").onclick = () => load(true);
load();
</script>
</body>
