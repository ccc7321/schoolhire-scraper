<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Court Finder</title>
<style>
:root {
  --bg: #f6f7f9; --card: #fff; --text: #16181d; --muted: #626a78; --line: #e2e5ea;
  --accent: #d9570f; --accent-soft: #fdeee4; --good: #1a7f4b; --good-soft: #e3f4ea;
  --on-accent: #fff; --ok: #8a6100; --ok-soft: #fbf1d6; --bad: #b42318; --bad-soft: #fde8e6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111317; --card: #1a1d23; --text: #e9ebef; --muted: #9aa2b1; --line: #2b3039;
    --accent: #ff8a3d; --accent-soft: #3a2415; --good: #5fd39a; --good-soft: #15301f;
    --on-accent: #16181d; --ok: #f1c35b; --ok-soft: #362b10; --bad: #ff8b80; --bad-soft: #3a1714;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 980px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 16px; }
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted);
  font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
select, input[type=time], input[type=text], input[type=url], input[type=number] { font: inherit; color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; min-height: 36px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 12px; }
.row > span { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase;
  letter-spacing: .03em; margin-right: 4px; }
.chip { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--bg);
  color: var(--muted); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.chip.err { border-color: var(--bad); }
.chip small { color: var(--muted); }
.actions { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
button.primary { font: inherit; font-weight: 600; background: var(--accent); color: var(--on-accent);
  border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; }
button.primary:disabled { opacity: .6; cursor: default; }
#status { color: var(--muted); font-size: 13px; }
.errors { color: var(--bad); background: var(--bad-soft); border-radius: 8px; padding: 8px 12px;
  font-size: 13px; margin-bottom: 12px; }
.errors:empty { display: none; }
.day { margin-bottom: 14px; }
.day h2 { font-size: 15px; margin: 0 0 6px; display: flex; gap: 8px; align-items: baseline; }
.day h2 span { color: var(--muted); font-weight: 400; font-size: 13px; }
.slot { display: grid; grid-template-columns: 112px 64px 1fr auto auto; gap: 10px; align-items: center;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 6px; }
.time { font-weight: 700; font-variant-numeric: tabular-nums; }
.dur { color: var(--muted); font-size: 13px; }
.court { min-width: 0; }
.court b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.court small { color: var(--muted); }
.badge { font-size: 12px; font-weight: 700; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.f100 { background: var(--good-soft); color: var(--good); }
.fpart { background: var(--ok-soft); color: var(--ok); }
a.book { font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
a.book:hover { text-decoration: underline; }
.empty { text-align: center; color: var(--muted); padding: 32px 0; }
.demo { background: var(--ok-soft); color: var(--ok); border-radius: 8px; padding: 6px 10px;
  font-size: 13px; display: inline-block; margin-bottom: 12px; }
details.panel > summary { font-weight: 700; cursor: pointer; }
details.panel[open] > summary { margin-bottom: 12px; }
.manage-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.manage-row input[type=url] { flex: 1; min-width: 220px; }
button.link { font: inherit; font-size: 13px; background: none; border: 0; color: var(--muted);
  cursor: pointer; padding: 4px 6px; }
button.link:hover { color: var(--bad); }
.court-list { margin-top: 12px; display: grid; gap: 6px; }
.court-item { display: grid; grid-template-columns: 1fr 90px 90px auto; gap: 8px; align-items: center;
  border-top: 1px solid var(--line); padding-top: 6px; }
.court-item small { display: block; color: var(--muted); }
.court-item input, .court-item select { width: 100%; }
.msg { font-size: 13px; margin-top: 8px; }
.msg.ok { color: var(--good); }
.msg.bad { color: var(--bad); }
@media (max-width: 620px) {
  .court-item { grid-template-columns: 1fr 1fr; }
  .court-item > div:first-child { grid-column: 1 / -1; }
  .slot { grid-template-columns: 1fr auto; }
  .slot .dur { display: none; }
  .slot .court { grid-column: 1 / -1; order: 3; }
  .slot a.book { order: 4; }
}
</style>
</head>
<body>
<main>
  <h1>Court Finder</h1>
  <p class="sub">Basketball slots with at least the chosen share of the hall free.</p>
  <div id="demo"></div>

  <section class="panel">
    <div class="filters">
      <label>Look ahead
        <select id="days"><option value="7">1 week</option><option value="14" selected>2 weeks</option>
          <option value="21">3 weeks</option><option value="28">4 weeks</option></select></label>
      <label>At least free
        <select id="min_free"><option value="25">25%</option><option value="50" selected>50%</option>
          <option value="75">75%</option><option value="100">100% (whole hall)</option></select></label>
      <label>Shortest slot
        <select id="min_minutes"><option value="30">30 min</option><option value="60" selected>1 hour</option>
          <option value="90">1.5 hours</option><option value="120">2 hours</option></select></label>
      <label>From <input type="time" id="after" step="1800"></label>
      <label>Until <input type="time" id="before" step="1800"></label>
      <label>Sort by
        <select id="sort"><option value="date">Date</option><option value="price">Price</option></select></label>
    </div>
    <div class="row" id="groups"><span>Group</span></div>
    <div class="row" id="weekdays"><span>Days</span></div>
    <div class="row" id="courts"><span>Courts</span></div>
    <div class="actions">
      <button class="primary" id="refresh">Refresh from site</button>
      <span id="status">Loading…</span>
    </div>
  </section>

  <details class="panel" id="manage">
    <summary>Manage groups &amp; courts</summary>
    <div class="manage-row">
      <label style="flex:1;min-width:160px">Group <select id="mGroup"></select></label>
      <button class="link" id="mRename" type="button">Rename</button>
      <button class="link" id="mDelete" type="button">Delete group</button>
      <button class="link" id="mNew" type="button" style="color:var(--accent)">+ New group</button>
    </div>
    <form class="manage-row" id="mAdd" style="margin-top:12px">
      <input type="url" id="mUrl" required
        placeholder="Paste a court's link, e.g. https://schoolhire.co.uk/…/basketball-court/4532">
      <button class="primary" type="submit">Add court</button>
    </form>
    <div class="msg" id="mMsg"></div>
    <div class="court-list" id="mCourts"></div>
  </details>

  <div class="errors" id="errors"></div>
  <div id="results"></div>
</main>

<script>
const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
const $ = id => document.getElementById(id);
const FIELDS = ["days", "min_free", "min_minutes", "after", "before", "sort"];
let state = { weekdays: [], hide: [], group: "" };
let courtsSeen = false;

function save() {
  const s = { ...state };
  FIELDS.forEach(f => s[f] = $(f).value);
  try { localStorage.setItem("courtFinder", JSON.stringify(s)); } catch (e) {}
}
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem("courtFinder") || "null");
    if (!s) return;
    FIELDS.forEach(f => { if (s[f] !== undefined) $(f).value = s[f]; });
    if (!$("sort").value) $("sort").value = "date";
    state.weekdays = s.weekdays || [];
    state.hide = s.hide || [];
    state.group = s.group || "";
  } catch (e) {}
}

function chip(label, on, onClick) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.innerHTML = label;
  b.onclick = onClick;
  return b;
}
function renderWeekdays() {
  const row = $("weekdays");
  row.querySelectorAll(".chip").forEach(c => c.remove());
  DAYS.forEach((d, i) => row.appendChild(chip(d, state.weekdays.includes(i), () => {
    state.weekdays = state.weekdays.includes(i)
      ? state.weekdays.filter(x => x !== i) : [...state.weekdays, i];
    renderWeekdays(); load();
  })));
}
// One chip per group; picking one only checks that group's courts.
function renderGroups(groups) {
  const row = $("groups");
  row.querySelectorAll(".chip").forEach(c => c.remove());
  row.style.display = groups.length > 1 ? "" : "none";
  [{ id: "", name: "All" }, ...groups].forEach(g =>
    row.appendChild(chip(esc(g.name), state.group === g.id, () => {
      state.group = g.id;
      courtsSeen = false;
      load();
    })));
}
const fmtPrice = p => p == null ? "price on site" : `£${p}`;

function renderCourts(courts) {
  const row = $("courts");
  row.querySelectorAll(".chip").forEach(c => c.remove());
  if (!courts.length) {
    row.insertAdjacentHTML("beforeend", '<span class="chip" style="cursor:default">' +
      "No courts yet: add one under “Manage groups &amp; courts”</span>");
  }
  courts.forEach(c => {
    const b = chip(`${esc(c.name)} <small>${fmtPrice(c.price)}</small>`,
      !state.hide.includes(c.url), () => {
        state.hide = state.hide.includes(c.url)
          ? state.hide.filter(x => x !== c.url) : [...state.hide, c.url];
        load();
      });
    b.title = c.error || c.notes || "";
    if (c.error) b.classList.add("err");
    row.appendChild(b);
  });
}

const esc = s => String(s).replace(/[&<>"']/g, m =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const fmtDay = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB",
  { weekday: "long", day: "numeric", month: "short" });
const fmtDur = m => (m >= 60 ? `${Math.floor(m / 60)}h` : "") + (m % 60 ? `${m % 60}m` : "");

function renderResults(data) {
  const out = $("results");
  if (!data.windows.length) {
    out.innerHTML = '<div class="empty">No slots match these filters. Try a lower % free, shorter slots or more days.</div>';
    return;
  }
  const byDate = new Map();
  data.windows.forEach(w => (byDate.get(w.date) || byDate.set(w.date, []).get(w.date)).push(w));
  const groups = $("sort").value === "date"
    ? [...byDate.entries()] : [["", data.windows]];
  out.innerHTML = groups.map(([date, ws]) => `
    <section class="day">
      ${date ? `<h2>${fmtDay(date)} <span>${ws.length} slot${ws.length > 1 ? "s" : ""}</span></h2>` : ""}
      ${ws.map(w => `
        <div class="slot">
          <div class="time">${date ? "" : `<div class="dur">${fmtDay(w.date)}</div>`}${w.start}–${w.end}</div>
          <div class="dur">${fmtDur(w.minutes)}</div>
          <div class="court"><b>${esc(w.court)}</b>
            <small>${fmtPrice(w.price)} · ${esc(w.court_size)} court${w.notes ? " · " + esc(w.notes) : ""}</small></div>
          <span class="badge ${w.min_free_pct === 100 ? "f100" : "fpart"}">${w.min_free_pct}% free</span>
          <a class="book" href="${esc(w.link)}" target="_blank" rel="noopener">Book ↗</a>
        </div>`).join("")}
    </section>`).join("");
}

let seq = 0;
async function load(refresh = false) {
  save();
  const my = ++seq;
  const p = new URLSearchParams();
  FIELDS.forEach(f => p.set(f, $(f).value));
  p.set("weekdays", state.weekdays.join(","));
  p.set("hide", state.hide.join("|"));
  p.set("group", state.group);
  if (refresh) p.set("refresh", "1");
  $("refresh").disabled = true;
  $("status").textContent = refresh || !courtsSeen ? "Fetching court calendars…" : "Filtering…";
  try {
    const r = await fetch("/api/slots?" + p);
    const data = await r.json();
    if (my !== seq) return;
    if (!r.ok) throw new Error(data.error || r.statusText);
    courtsSeen = true;
    if (state.group !== data.group) { state.group = data.group; save(); }  // deleted group: All
    renderGroups(data.groups);
    renderCourts(data.courts);
    renderResults(data);
    const errs = data.courts.filter(c => c.error);
    $("errors").innerHTML = errs.map(c => `<div><b>${esc(c.name)}</b>: ${esc(c.error)}</div>`).join("");
    const at = data.courts.map(c => c.fetched_at).sort()[0];
    $("status").textContent = `${data.windows.length} slots · ${fmtDay(data.start)} – ${fmtDay(data.end)} · data from ${at}`;
    $("demo").innerHTML = data.demo ? '<span class="demo">Demo mode: showing the saved sample file, not live data.</span>' : "";
  } catch (e) {
    if (my === seq) $("status").textContent = "Error: " + e.message;
  } finally {
    if (my === seq) $("refresh").disabled = false;
  }
}

// ------------------------------------------------------------------ manage groups & courts

let groups = [];  // [{ id, name, courts: [...] }]
const mGroup = () => groups.find(g => g.id === $("mGroup").value);
const msg = (text, ok) => { $("mMsg").textContent = text; $("mMsg").className = "msg " + (ok ? "ok" : "bad"); };

async function manageCall(method, url, body) {
  const r = await fetch(url, { method, headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const json = await r.json();
  if (!r.ok) { msg(json.error || r.statusText, false); return null; }
  groups = json.groups || json;
  renderManage();
  return json;
}

function renderManage() {
  const sel = $("mGroup"), was = sel.value || state.group || (groups[0] || {}).id;
  sel.innerHTML = groups.map(g =>
    `<option value="${esc(g.id)}">${esc(g.name)} (${g.courts.length})</option>`).join("");
  sel.value = groups.some(g => g.id === was) ? was : (groups[0] || {}).id || "";
  const g = mGroup();
  ["mAdd", "mRename", "mDelete"].forEach(id => $(id).style.display = g ? "" : "none");
  $("mCourts").innerHTML = !g ? "<p class=\"sub\">No groups yet. Press “+ New group” to make one.</p>"
    : !g.courts.length ? "<p class=\"sub\">No courts in this group yet. Paste a court’s link above.</p>"
    : g.courts.map(c => `
      <div class="court-item" data-url="${esc(c.url)}">
        <div><b>${esc(c.name)}</b><small>${esc(c.postcode || "")}${c.notes ? " · " + esc(c.notes) : ""}
          · <a href="${esc(c.url)}" target="_blank" rel="noopener">page ↗</a></small></div>
        <label>£ / hour <input type="number" min="0" step="0.01" value="${c.price ?? ""}" data-f="price"></label>
        <label>Size <select data-f="court"><option value="half"${c.court !== "full" ? " selected" : ""}>Half</option>
          <option value="full"${c.court === "full" ? " selected" : ""}>Full</option></select></label>
        <button class="link" type="button" data-remove>Remove</button>
      </div>`).join("");
}

$("mGroup").addEventListener("change", () => { msg("", true); renderManage(); });
$("mNew").onclick = async () => {
  const name = (prompt("Name for the new group, e.g. Tuesday crew") || "").trim();
  if (!name) return;
  if (await manageCall("POST", "/api/groups", { name })) {
    $("mGroup").value = groups[groups.length - 1].id;
    renderManage();
    msg(`Made ${name}. Now paste a court’s link to add it.`, true);
    load();
  }
};
$("mRename").onclick = async () => {
  const g = mGroup(), name = g && (prompt("New name", g.name) || "").trim();
  if (name && await manageCall("PUT", `/api/groups/${g.id}`, { name })) { msg("Renamed.", true); load(); }
};
$("mDelete").onclick = async () => {
  const g = mGroup();
  if (g && confirm(`Delete ${g.name} and its ${g.courts.length} court(s)?`)
      && await manageCall("DELETE", `/api/groups/${g.id}`)) { msg(`Deleted ${g.name}.`, true); load(); }
};
$("mAdd").addEventListener("submit", async e => {
  e.preventDefault();
  const g = mGroup();
  msg("Reading the court’s page…", true);
  const res = await manageCall("POST", `/api/groups/${g.id}/courts`, { url: $("mUrl").value });
  if (res) {
    const c = res.added;
    msg(`Added ${c.name}${c.price != null ? ` (£${c.price}/hour, ${c.court} hall)` : ""} to ${g.name}. ` +
        "Check the price and size below.", true);
    $("mUrl").value = "";
    load(true);
  }
});
// Editing a court's price or size saves straight away.
$("mCourts").addEventListener("change", e => {
  const item = e.target.closest("[data-url]"), field = e.target.dataset.f;
  if (item && field) manageCall("PATCH", `/api/groups/${mGroup().id}/courts`,
    { url: item.dataset.url, [field]: e.target.value }).then(r => r && load());
});
$("mCourts").addEventListener("click", async e => {
  const item = e.target.closest("[data-url]");
  if (!item || e.target.dataset.remove === undefined) return;
  const g = mGroup(), c = g.courts.find(x => x.url === item.dataset.url);
  if (confirm(`Remove ${c.name} from ${g.name}?`)
      && await manageCall("DELETE", `/api/groups/${g.id}/courts?url=${encodeURIComponent(c.url)}`)) load();
});

restore();
renderWeekdays();
manageCall("GET", "/api/groups");
FIELDS.forEach(f => $(f).addEventListener("change", () => load()));
$("refresh").onclick = () => load(true);
load();
</script>
</body>
</html>
